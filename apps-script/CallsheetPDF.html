<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:10px;color:#172033;padding:20px}h1{text-align:center;font-size:19px}table{width:100%;border-collapse:collapse;margin-bottom:14px}th,td{border:.5px solid #9aa8b6;padding:5px;text-align:center}th{background:#eaf1f6}.meta td{border:0;text-align:left}.evidence{page-break-inside:avoid}.evidence img{max-width:260px;max-height:220px}.sign{margin-left:auto;margin-top:35px;width:220px;text-align:center}.space{height:50px}.line{border-top:1px solid #172033;padding-top:4px}</style></head><body>
<? var h=job.payload.header||{}; var stores=job.payload.stores||[]; var mutation=job.payload.mutation||{}; function rp(v){return 'Rp '+Number(v||0).toLocaleString('id-ID');} ?>
<h1>DAILY CALLSHEET</h1><table class="meta"><tr><td><b>Date:</b> <?= h.date||'-' ?></td><td><b>Job Order:</b> <?= h.jobOrder||'-' ?></td></tr><tr><td><b>Area:</b> <?= job.area||'-' ?></td><td><b>Crew ID:</b> <?= h.crewId||'-' ?></td></tr><tr><td><b>Driver:</b> <?= h.driver||'-' ?></td><td><b>Helper:</b> <?= h.helper||'-' ?></td></tr><tr><td><b>Nopol:</b> <?= h.plate||'-' ?></td><td><b>Unit/Vendor:</b> <?= (h.unit||'-')+' / '+(h.vendor||'-') ?></td></tr><tr><td><b>Jam Masuk:</b> <?= h.timeIn||'-' ?></td><td><b>Jam Pulang:</b> <?= h.timeOut||'-' ?></td></tr></table>
<table><thead><tr><th>No</th><th>ID Toko</th><th>Nama Toko</th><th>TKBM</th><th>Parkir</th><th>Giro</th><th>Keamanan</th><th>Tol</th><th>Lain-lain</th><th>Mutasi</th></tr></thead><tbody><? for(var i=0;i<stores.length;i++){var s=stores[i],c=s.costs||{}; ?><tr><td><?= i+1 ?></td><td><?= s.id||'-' ?></td><td><?= s.name||'-' ?></td><td><?= rp(c.tkbm) ?></td><td><?= rp(c.parking) ?></td><td><?= rp(c.giro) ?></td><td><?= rp(c.security) ?></td><td><?= rp(c.toll) ?></td><td><?= rp(c.other) ?></td><td><?= mutation.enabled?'Ya':'No' ?></td></tr><? } ?></tbody></table>
<? var labels={tkbm:'Kwitansi TKBM',parking:'Kwitansi Parkir Liar',giro:'Kwitansi Giro',security:'Kwitansi Keamanan',toll:'Struk Tol',other:'Biaya Lain-lain'}; for(var a=0;a<stores.length;a++){var photos=(job.storePhotoData||[])[a]||{},keys=Object.keys(photos);if(keys.length){ ?><div class="evidence"><h3>Evidence Toko <?= a+1 ?> - <?= stores[a].name||'' ?></h3><table><tbody><? for(var k=0;k<keys.length;k+=2){ ?><tr><? for(var z=0;z<2;z++){var key=keys[k+z]; ?><td><? if(key){ ?><b><?= labels[key]||key ?></b><br><img src="<?!= photos[key] ?>"><? } ?></td><? } ?></tr><? } ?></tbody></table></div><? }} ?>
