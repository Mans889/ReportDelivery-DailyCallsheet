<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153c68"><title>Daily Callsheet</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/src/css/app.css"></head><body><div id="boot" class="boot"><div class="spinner"></div><b>DAILY CALLSHEET</b></div><main id="app" class="app hidden"><header class="top"><div><small>REPORT DELIVERY</small><strong>DAILY CALLSHEET</strong></div><div class="topActions"><button id="adminLock" class="icon3d" type="button" title="Administrator">🔒</button><button id="adminAutofill" class="adminFill hidden" type="button">⚡ Autofill Test</button><span id="stepBadge">01 / 03</span></div></header><div class="progress"><i id="progressBar"></i></div><form id="callsheetForm" novalidate><section class="screen active" data-step="1"><div class="screenTitle"><h1>Report Pengiriman</h1><p>Pengisian Data Pengiriman Hari ini</p></div><div class="card grid"><div class="field"><label class="req">Tanggal</label><input id="date" type="date" required></div><div class="field"><label class="req">Job Order</label><div class="prefix"><span>JO-</span><input id="jobOrder" inputmode="numeric" placeholder="Nomor JO" required></div></div><div class="field wide"><label class="req">Area</label><select id="area" required><option value="">Pilih Area</option></select></div><div class="field"><label class="req">Crew ID</label><input id="crewId" list="crewList" autocomplete="off" placeholder="Cari Crew ID" required><datalist id="crewList"></datalist></div><div class="field"><label class="req">Nama Driver</label><input id="driver" list="driverList" autocomplete="off" placeholder="Cari Driver" required><datalist id="driverList"></datalist></div><div class="field"><label>Nama Helper</label><input id="helper" placeholder="Nama helper" autocomplete="off"></div><div class="field"><label class="req">Nomor Polisi</label><input id="plate" required></div><div class="field"><label>Tipe Unit</label><input id="unit" readonly></div><div class="field"><label>Vendor</label><input id="vendor" readonly></div><div class="field"><label class="req">Jam Masuk</label><input id="timeIn" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" readonly required></div><div class="field"><label class="req">Jam Pulang</label><input id="timeOut" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" required></div></div></section><section class="screen" data-step="2"><div class="screenTitle"><h1>Toko & Biaya</h1><p>Ritase, pengeluaran, dan evidence</p></div><div id="storeList"></div><button class="ghost add-store" type="button" id="addStore">＋ Tambah Toko</button><div class="card mutation"><label class="toggle"><input type="checkbox" id="mutation"><span></span><b>Status Mutasi</b></label><div id="mutationPanel" class="hidden"><div class="grid"><div class="field"><label>Dari</label><select id="routeFrom"></select></div><div class="field"><label>Tujuan</label><div id="destinationList"></div></div></div><button type="button" class="ghost mini" id="addDestination">＋ Tambah Tujuan</button></div></div></section><section class="screen" data-step="3"><div class="screenTitle"><h1>Konfirmasi</h1></div><div class="card summary" id="summary"></div><button class="submit" type="submit">Submit & Proses Callsheet</button><div id="result" class="result hidden"></div></section><nav><button type="button" id="back" class="secondary">Kembali</button><button type="button" id="next" class="primary">Lanjut</button></nav></form></main><div id="toast" class="toast"></div><div id="overlay" class="overlay hidden"><div class="spinner"></div><b id="overlayText">Processing Data</b><small>Jangan tutup aplikasi</small></div><script type="module" src="/src/js/app.js"></script></body></html>
